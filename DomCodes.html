<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(196, 181, 253, 0.42),
            transparent 28%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(147, 197, 253, 0.38),
            transparent 30%
          ),
          #f8fafc;
      }

      .container {
        width: min(100%, 1050px);
        text-align: center;
        padding: clamp(48px, 8vw, 88px) clamp(24px, 7vw, 72px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow:
          0 24px 70px rgba(71, 85, 105, 0.12),
          0 2px 8px rgba(71, 85, 105, 0.06);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      h1 {
        max-width: 760px;
        margin: 0 auto 32px;
        color: #111827;
        font-size: clamp(2.25rem, 6vw, 4.75rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.055em;
        background: linear-gradient(
          120deg,
          #0f172a 15%,
          #475569 55%,
          #0f172a 85%
        );
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      button {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        padding: 14px 24px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        color: #ffffff;
        background: linear-gradient(135deg, #111827, #1e293b);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.16) inset,
          0 10px 24px rgba(15, 23, 42, 0.22),
          0 2px 6px rgba(15, 23, 42, 0.18);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.015em;
        cursor: pointer;
        padding: 1.2rem;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      button::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background: linear-gradient(135deg, #334155, #0f172a);
        content: "";
        opacity: 0;
        transition: opacity 180ms ease;
      }

      button:hover {
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.2) inset,
          0 14px 30px rgba(15, 23, 42, 0.28),
          0 3px 8px rgba(15, 23, 42, 0.2);
        transform: translateY(-2px);
      }

      button:hover::before {
        opacity: 1;
      }

      button:active {
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.12) inset,
          0 5px 14px rgba(15, 23, 42, 0.24);
        transform: translateY(0) scale(0.98);
      }

      button:focus-visible {
        outline: 3px solid rgba(59, 130, 246, 0.35);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="heading">My First Js Code. Feels Good!</h1>
      <button id="btn">Click Me baby!</button>
    </div>
    <script>
      let firstHeading = document.getElementById("heading");
      firstHeading.textContent = "This wont be my last.";
      let btnmanipulator = document.getElementById("btn");
      btnmanipulator.textContent = "Submit!";
    </script>
  </body>
</html>
